[project]
name = "finance-agent-evals"
version = "0.1.0"
description = "Personal finance agent over bank statements, with an evaluation suite and metrics dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mirela Schneider Bianchi" }]
dependencies = [
    "litellm>=1.50",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.45",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.ruff]
line-length = 100
